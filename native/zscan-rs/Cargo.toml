[package]
name = "zscan"
version = "0.1.0"
edition = "2021"
description = "zswarm: Claude Code transcript scanner (the native arm of claude_usage.collect)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
walkdir = "2"
memchr = "2"

[profile.release]
lto = "thin"
codegen-units = 1
