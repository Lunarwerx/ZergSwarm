name: Release

# Push a tag like v0.2.0: this runs the tests, builds the wheel and source archive, installs the wheel on all three
# systems, and publishes a GitHub release with both files attached. install.ps1 and install.sh install from it.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag, pyproject.toml and zswarm/__init__.py agree on the version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"(.+?)\"", pathlib.Path("zswarm/__init__.py").read_text()).group(1))')"
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but zswarm/__init__.py says $have"; exit 1; }
          test "$want" = "$pkg" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $pkg"; exit 1; }
      # The release's notes are its CHANGELOG.md section, never GitHub's generated notes: with no pull requests
      # those are a bare "Full Changelog" link, which every release through 1.2.7 shipped as.
      - name: Release notes from CHANGELOG.md, and never just a link
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p notes
          awk -v ver="$ver" 'index($0, "## [" ver "]") == 1 { grab = 1; next } grab && /^## / { exit } grab { print }' \
            CHANGELOG.md > notes/RELEASE_NOTES.md
          words="$(sed -E 's#\[([^]]*)\]\([^)]*\)#\1#g; s#https?://[^ )>]+##g' notes/RELEASE_NOTES.md \
            | grep -oiE '[a-z0-9]+' | grep -viE '^(full|changelog|what|s|changed|see|release|notes|compare|the|at|here|for|details)$' \
            | wc -l)"
          if [ "$words" -lt 5 ]; then
            echo "::error::CHANGELOG.md has no real section for $ver (a release's notes say what changed, never just a link)"
            exit 1
          fi
          cat notes/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes
          path: notes/
      - run: python -m pip install -e ".[test]" build
      - run: python -m pytest -q --timeout 120
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  wheel-works:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # From an empty folder, so Python imports the installed wheel and nothing else.
      - name: Install the wheel and run it
        shell: bash
        run: |
          python -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          zswarm --version
          python -c "from importlib.resources import files; from zswarm import config; assert len(config.PROVIDERS) >= 10, config.PROVIDERS; assert files('zswarm').joinpath('ui', 'console.html').is_file(); print('providers', len(config.PROVIDERS))"

  release:
    needs: wheel-works
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notes
          path: notes/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: notes/RELEASE_NOTES.md
