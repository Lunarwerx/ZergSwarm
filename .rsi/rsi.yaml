schema: hydra-rsi/1
# Committed bytes of the zswarm package (code and package-data) that a user installs; smaller means less to load, read and maintain.
metrics:
  - id: zswarm.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
