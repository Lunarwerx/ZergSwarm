# Cohere, the Command family, through its OpenAI-compatibility endpoint.

base_url = "https://api.cohere.ai/compatibility/v1"
about = "Cohere's Command models. A free trial key, then paid per use."
key_url = "https://dashboard.cohere.com/api-keys"  # where a person makes an API key
website = "https://cohere.com"  # the company's site; the console shows its favicon
models_path = "/models"
docs = "https://docs.cohere.com/docs/compatibility-api"

# Tested 2026-09-26 on trial keys through the compatibility endpoint; both answer cleanly (Command A Plus and Command A
# Reasoning put their thinking into the answer text there, so they are left out). No published test scores, so AUTO
# never picks them: a task reaches them by name (model: "command-a") or through a role.
# NOT a backup: tried as one on 2026-09-26 it wrote tool calls and schema answers as plain text, which came back
# marked ok with no data (a dozen tasks across four jobs). A backup must pass the harness's own tool protocol.
[models.command-a]
api_id = "command-a-03-2025"
ctx = 256000
max_out = 8192
tools = true
price = {hit = 2.5, miss = 2.5, out = 10.0}

[models.command-r7b]
api_id = "command-r7b-12-2024"
ctx = 128000
max_out = 4096
price = {hit = 0.0375, miss = 0.0375, out = 0.15}
